<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0f1115" />
    <meta
      name="description"
      content="날짜별 업무를 등록하고 완료 상태를 관리하는 장지연 워크캘린더"
    />
    <title>장지연 워크캘린더</title>
    <link rel="icon" href="./favicon.svg" type="image/svg+xml" />
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <div class="app-shell">
      <header class="topbar">
        <div class="brand-block" aria-label="장지연 워크캘린더">
          <div class="brand-mark" aria-hidden="true">J</div>
          <div class="brand-copy">
            <h1>장지연 워크캘린더</h1>
            <p>업무를 기록하고 완료 상태를 한눈에 관리하세요.</p>
          </div>
        </div>

        <nav class="month-navigation" aria-label="월 이동">
          <button class="button button-secondary today-button" id="todayButton" type="button">
            오늘
          </button>
          <div class="arrow-group">
            <button class="icon-button" id="previousMonthButton" type="button" aria-label="이전 달">
              <svg viewBox="0 0 24 24" aria-hidden="true">
                <path d="m15 18-6-6 6-6" />
              </svg>
            </button>
            <button class="icon-button" id="nextMonthButton" type="button" aria-label="다음 달">
              <svg viewBox="0 0 24 24" aria-hidden="true">
                <path d="m9 18 6-6-6-6" />
              </svg>
            </button>
          </div>
          <button class="month-title-button" id="monthPickerButton" type="button" aria-label="월 선택">
            <span id="monthTitle">2026년 8월</span>
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <path d="m7 10 5 5 5-5" />
            </svg>
          </button>
          <input class="month-picker" id="monthPicker" type="month" aria-label="표시할 월 선택" />
        </nav>

        <div class="header-actions">
          <button class="button button-ghost desktop-action" id="exportButton" type="button" title="업무 백업 파일 저장">
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <path d="M12 3v12" />
              <path d="m7 10 5 5 5-5" />
              <path d="M5 21h14" />
            </svg>
            백업
          </button>
          <label class="button button-ghost desktop-action import-label" title="백업 파일 불러오기">
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <path d="M12 21V9" />
              <path d="m7 14 5-5 5 5" />
              <path d="M5 3h14" />
            </svg>
            복원
            <input id="importInput" type="file" accept="application/json,.json" />
          </label>
          <button class="button button-primary" id="addTaskButton" type="button">
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <path d="M12 5v14" />
              <path d="M5 12h14" />
            </svg>
            업무 등록
          </button>
        </div>
      </header>

      <section class="status-strip" aria-label="이번 달 업무 현황">
        <div class="status-left">
          <div class="status-item">
            <span class="status-label">전체 업무</span>
            <strong id="totalTaskCount">0</strong>
          </div>
          <div class="status-divider" aria-hidden="true"></div>
          <div class="status-item">
            <span class="status-label">완료</span>
            <strong id="completedTaskCount">0</strong>
          </div>
          <div class="status-divider" aria-hidden="true"></div>
          <div class="status-item">
            <span class="status-label">남은 업무</span>
            <strong id="remainingTaskCount">0</strong>
          </div>
          <div class="completion-progress" aria-label="이번 달 완료율">
            <div class="completion-progress-track">
              <span id="completionProgressBar"></span>
            </div>
            <strong id="completionRate">0%</strong>
          </div>
        </div>

        <label class="toggle-control">
          <input id="hideCompletedToggle" type="checkbox" />
          <span class="toggle-ui" aria-hidden="true"></span>
          완료 업무 숨기기
        </label>
      </section>

      <main class="calendar-card">
        <div class="calendar-scroll" id="calendarScroll">
          <div class="weekdays" aria-hidden="true">
            <div class="weekday sunday">일</div>
            <div class="weekday">월</div>
            <div class="weekday">화</div>
            <div class="weekday">수</div>
            <div class="weekday">목</div>
            <div class="weekday">금</div>
            <div class="weekday saturday">토</div>
          </div>
          <section class="calendar-grid" id="calendarGrid" aria-label="월간 업무 달력"></section>
        </div>
      </main>

      <p class="storage-note">
        입력한 업무는 현재 브라우저에 자동 저장됩니다. 같은 기기·같은 브라우저에서는 새로고침해도 유지됩니다.
      </p>
    </div>

    <button class="mobile-floating-button" id="mobileAddTaskButton" type="button" aria-label="업무 등록">
      <svg viewBox="0 0 24 24" aria-hidden="true">
        <path d="M12 5v14" />
        <path d="M5 12h14" />
      </svg>
    </button>

    <dialog class="task-dialog" id="taskDialog">
      <form class="task-form" id="taskForm" novalidate>
        <div class="dialog-header">
          <div>
            <p class="dialog-eyebrow" id="dialogEyebrow">새 업무</p>
            <h2 id="dialogTitle">업무 등록</h2>
          </div>
          <button class="icon-button close-button" id="closeDialogButton" type="button" aria-label="닫기">
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <path d="M18 6 6 18" />
              <path d="m6 6 12 12" />
            </svg>
          </button>
        </div>

        <input id="taskId" type="hidden" />

        <div class="form-field">
          <label for="taskTitle">업무명 <span aria-hidden="true">*</span></label>
          <input
            id="taskTitle"
            name="taskTitle"
            type="text"
            maxlength="80"
            autocomplete="off"
            placeholder="예: 월간 실적 보고서 작성"
            required
          />
          <p class="field-error" id="taskTitleError" role="alert"></p>
        </div>

        <div class="form-row">
          <div class="form-field">
            <label for="taskDate">날짜 <span aria-hidden="true">*</span></label>
            <input id="taskDate" name="taskDate" type="date" required />
            <p class="field-error" id="taskDateError" role="alert"></p>
          </div>

          <div class="form-field">
            <label for="taskCategory">구분</label>
            <select id="taskCategory" name="taskCategory">
              <option value="work">업무</option>
              <option value="meeting">미팅</option>
              <option value="deadline">마감</option>
              <option value="personal">개인</option>
            </select>
          </div>
        </div>

        <div class="form-field">
          <label for="taskMemo">메모</label>
          <textarea
            id="taskMemo"
            name="taskMemo"
            maxlength="500"
            rows="4"
            placeholder="필요한 세부 내용을 적어두세요."
          ></textarea>
        </div>

        <label class="completed-field" id="completedField">
          <input id="taskCompleted" type="checkbox" />
          <span class="completed-check" aria-hidden="true">
            <svg viewBox="0 0 24 24">
              <path d="m5 12 4 4L19 6" />
            </svg>
          </span>
          이 업무를 완료 상태로 표시
        </label>

        <div class="dialog-actions">
          <button class="button button-danger hidden" id="deleteTaskButton" type="button">삭제</button>
          <div class="dialog-actions-right">
            <button class="button button-secondary" id="cancelDialogButton" type="button">취소</button>
            <button class="button button-primary" type="submit">저장</button>
          </div>
        </div>
      </form>
    </dialog>

    <div class="toast" id="toast" role="status" aria-live="polite"></div>

    <template id="dayCellTemplate">
      <article class="day-cell">
        <div class="day-header">
          <button class="date-number" type="button"></button>
          <button class="day-add-button" type="button" aria-label="이 날짜에 업무 추가">
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <path d="M12 5v14" />
              <path d="M5 12h14" />
            </svg>
          </button>
        </div>
        <div class="task-list"></div>
      </article>
    </template>

    <script src="./app.js" defer></script>
  </body>
</html>
